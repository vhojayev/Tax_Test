<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MapLens">
<title>MapLens</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#10161c; --panel:#1a232c; --line:#2c3a47; --fg:#e8eef3; --muted:#8fa1b0; --accent:#3ecf8e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .bar { position: absolute; z-index: 1000; left: 0; right: 0; display: flex; gap: 8px; padding: 8px 12px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .top { top: env(safe-area-inset-top, 0px); }
  .bottom { bottom: env(safe-area-inset-bottom, 0px); justify-content: flex-end; padding-bottom: 12px; }
  input, select, button { font: inherit; color: var(--fg); }
  #q { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
  .fab { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 46px; height: 46px; padding: 0 14px; font-weight: 600; }
  .fab.on { background: var(--accent); color: #06281a; border-color: var(--accent); }
  .sheet { position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; max-height: 72%; overflow: auto;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .sheet[hidden] { display: none; }
  .sheet h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row label { flex: 1; min-width: 0; }
  .row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  .row input[type=range] { width: 90px; accent-color: var(--accent); }
  .field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06281a; font-weight: 600; }
  .btn.danger { color: #ff8a8a; }
  .muted { color: var(--muted); font-size: 13px; }
  .pin-item { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .pin-item b { display: block; }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar top">
  <input id="q" type="search" placeholder="Search an address or place" enterkeyhint="search" autocomplete="off">
  <button class="fab" id="btnLayers" aria-label="Layers">Layers</button>
</div>
<div class="bar bottom">
  <button class="fab" id="btnPins" aria-label="Saved pins">Pins</button>
  <button class="fab" id="btnLocate" aria-label="My location">Me</button>
</div>

<section class="sheet" id="layersSheet" hidden>
  <h2>Base map</h2>
  <div id="baseList"></div>
  <h2 style="margin-top:18px">Overlays</h2>
  <div id="overlayList"></div>
  <h2 style="margin-top:18px">Add your own layer</h2>
  <p class="muted" style="margin:0">Paste a tile URL with {z}/{x}/{y}. County parcel maps, zoning and other sources often publish one.</p>
  <input class="field" id="customName" placeholder="Name">
  <input class="field" id="customUrl" placeholder="https://example.com/tiles/{z}/{x}/{y}.png" autocapitalize="off" autocorrect="off">
  <div class="btns"><button class="btn primary" id="addCustom">Add layer</button><button class="btn" data-close>Done</button></div>
</section>

<section class="sheet" id="pinSheet" hidden>
  <h2>New pin</h2>
  <p class="muted" id="pinCoords" style="margin:0"></p>
  <input class="field" id="pinTitle" placeholder="Title (e.g. 123 Oak St)">
  <input class="field" id="pinNote" placeholder="Note (price, thoughts)">
  <input class="field" id="pinLink" placeholder="Link (optional, e.g. a Zillow listing URL)" autocapitalize="off" autocorrect="off">
  <div class="btns"><button class="btn primary" id="pinSave">Save pin</button><button class="btn" data-close>Cancel</button></div>
</section>

<section class="sheet" id="listSheet" hidden>
  <h2>Saved pins</h2>
  <div id="pinList"></div>
  <div class="btns"><button class="btn" data-close>Close</button></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('maplens.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('maplens.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  var $ = function (id) { return document.getElementById(id); };

  var map = L.map('map', { zoomControl: false, attributionControl: true }).setView(store.get('view', [39.5, -98.35]).slice(0, 2), store.get('view', [0, 0, 4])[2] || 4);
  map.attributionControl.setPrefix(false);
  map.on('moveend', function () { var c = map.getCenter(); store.set('view', [c.lat, c.lng, map.getZoom()]); });

  var bases = {
    street:    { name: 'Street',    layer: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }) },
    satellite: { name: 'Satellite', layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' }) },
    topo:      { name: 'Topo',      layer: L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'USGS' }) }
  };

  var overlays = {
    flood:   { name: 'FEMA flood zones (US)', layer: L.tileLayer.wms('https://hazards.fema.gov/gis/nfhl/services/public/NFHL/MapServer/WMSServer', { layers: '28', format: 'image/png', transparent: true, attribution: 'FEMA NFHL' }) },
    labels:  { name: 'Place names', layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }) },
    roads:   { name: 'Roads', layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }) },
    rail:    { name: 'Railways', layer: L.tileLayer('https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', { maxZoom: 19, attribution: 'OpenRailwayMap' }) },
    cycling: { name: 'Cycling routes', layer: L.tileLayer('https://tile.waymarkedtrails.org/cycling/{z}/{x}/{y}.png', { maxZoom: 18, attribution: 'Waymarked Trails' }) }
  };

  // Schools: US public schools from NCES, loaded for the visible area (zoom 12+)
  var NCES = 'https://nces.ed.gov/opengis/rest/services/K12_School_Locations/EDGE_GEOCODE_PUBLICSCH_2223/MapServer/0/query';
  var schoolGroup = L.layerGroup();
  var schoolSeq = 0;
  var toast = document.createElement('div');
  toast.style.cssText = 'position:absolute;z-index:1050;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#1a232c;border:1px solid #2c3a47;border-radius:10px;padding:8px 12px;font-size:13px;display:none';
  document.body.appendChild(toast);
  function say(t) { toast.textContent = t; toast.style.display = t ? 'block' : 'none'; }
  function levelColor(l) {
    l = String(l || '').toLowerCase();
    return l.indexOf('high') > -1 ? '#ff7a59' : l.indexOf('middle') > -1 ? '#f5c542' : l.indexOf('elem') > -1 || l.indexOf('prim') > -1 ? '#3ecf8e' : '#8fa1b0';
  }
  function loadSchools() {
    if (!map.hasLayer(schoolGroup)) { say(''); return; }
    if (map.getZoom() < 12) { schoolGroup.clearLayers(); say('Zoom in to see schools'); return; }
    var b = map.getBounds(), seq = ++schoolSeq;
    var url = NCES + '?f=json&where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&inSR=4326&spatialRel=esriSpatialRelIntersects&resultRecordCount=500' +
      '&geometryType=esriGeometryEnvelope&geometry=' + [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(',');
    say('Loading schools…');
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      if (seq !== schoolSeq) return;
      if (!d.features) throw new Error('bad response');
      schoolGroup.clearLayers();
      d.features.forEach(function (f) {
        var a = f.attributes || {}, g = f.geometry; if (!g) return;
        var name = a.NAME || a.SCH_NAME || 'School', city = a.CITY || a.LCITY || '', st = a.STATE || a.LSTATE || '';
        var level = a.LEVEL || a.SCHOOL_LEVEL || '';
        var html = '<b>' + esc(name) + '</b><br>' + esc([a.STREET || a.LSTREET1, city, st].filter(Boolean).join(', ')) +
          (level ? '<br>Level: ' + esc(level) : '') +
          (a.ENROLLMENT || a.MEMBER ? '<br>Students: ' + esc(a.ENROLLMENT || a.MEMBER) : '') +
          '<br><a href="https://www.greatschools.org/search/search.page?q=' + encodeURIComponent([name, city, st].join(' ')) + '" target="_blank" rel="noopener">View rating on GreatSchools</a>';
        L.circleMarker([g.y, g.x], { radius: 7, color: '#10161c', weight: 2, fillColor: levelColor(level), fillOpacity: 1 }).bindPopup(html).addTo(schoolGroup);
      });
      say(d.exceededTransferLimit ? 'Showing first 500 schools. Zoom in for more.' : (d.features.length ? '' : 'No schools in this view'));
    }).catch(function () { if (seq === schoolSeq) say('Could not load schools. Check connection.'); });
  }
  schoolGroup.on('add', loadSchools);
  schoolGroup.on('remove', function () { say(''); });
  map.on('moveend', loadSchools);
  overlays.schools = { name: 'Schools (US public)', layer: schoolGroup };

  var customs = store.get('customs', []);
  customs.forEach(function (c, i) { overlays['c' + i] = { name: c.name, custom: true, layer: L.tileLayer(c.url, { maxZoom: 20 }) }; });

  var state = store.get('state', { base: 'street', on: ['flood'], opacity: {} });
  var pinsLayer = L.layerGroup().addTo(map);
  // esc() is declared below with the pin helpers; hoisted so schools can use it
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var activeBase = null;

  function setBase(key) {
    if (!bases[key]) key = 'street';
    if (activeBase) map.removeLayer(bases[activeBase].layer);
    bases[key].layer.addTo(map).bringToBack();
    activeBase = state.base = key;
    store.set('state', state);
  }

  function applyOverlay(key) {
    var o = overlays[key], on = state.on.indexOf(key) > -1;
    if (on && !map.hasLayer(o.layer)) o.layer.addTo(map);
    if (!on && map.hasLayer(o.layer)) map.removeLayer(o.layer);
    if (o.layer.setOpacity) o.layer.setOpacity(state.opacity[key] != null ? state.opacity[key] : 0.8);
  }

  function renderLayers() {
    var b = $('baseList'); b.innerHTML = '';
    Object.keys(bases).forEach(function (k) {
      var r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<input type="radio" name="base" id="b_' + k + '"' + (state.base === k ? ' checked' : '') + '><label for="b_' + k + '">' + bases[k].name + '</label>';
      r.querySelector('input').addEventListener('change', function () { setBase(k); });
      b.appendChild(r);
    });
    var o = $('overlayList'); o.innerHTML = '';
    Object.keys(overlays).forEach(function (k) {
      var r = document.createElement('div'); r.className = 'row';
      var on = state.on.indexOf(k) > -1;
      r.innerHTML = '<input type="checkbox" id="o_' + k + '"' + (on ? ' checked' : '') + '><label for="o_' + k + '"></label>' +
        '<input type="range" min="0.1" max="1" step="0.1" value="' + (state.opacity[k] != null ? state.opacity[k] : 0.8) + '" aria-label="Opacity">' +
        (overlays[k].custom ? '<button class="btn danger" aria-label="Remove">×</button>' : '');
      r.querySelector('label').textContent = overlays[k].name;
      r.querySelector('input[type=checkbox]').addEventListener('change', function (e) {
        var i = state.on.indexOf(k);
        if (e.target.checked && i < 0) state.on.push(k);
        if (!e.target.checked && i > -1) state.on.splice(i, 1);
        store.set('state', state); applyOverlay(k);
      });
      r.querySelector('input[type=range]').addEventListener('input', function (e) {
        state.opacity[k] = parseFloat(e.target.value); store.set('state', state); applyOverlay(k);
      });
      var del = r.querySelector('button');
      if (del) del.addEventListener('click', function () {
        var idx = parseInt(k.slice(1), 10);
        map.removeLayer(overlays[k].layer); delete overlays[k];
        customs.splice(idx, 1); store.set('customs', customs);
        // reindex remaining customs
        Object.keys(overlays).forEach(function (kk) { if (overlays[kk].custom) { map.removeLayer(overlays[kk].layer); delete overlays[kk]; } });
        state.on = state.on.filter(function (x) { return x[0] !== 'c'; }); store.set('state', state);
        customs.forEach(function (c, j) { overlays['c' + j] = { name: c.name, custom: true, layer: L.tileLayer(c.url, { maxZoom: 20 }) }; });
        renderLayers();
      });
      o.appendChild(r);
    });
  }

  setBase(state.base);
  Object.keys(overlays).forEach(applyOverlay);
  renderLayers();

  $('addCustom').addEventListener('click', function () {
    var name = $('customName').value.trim(), url = $('customUrl').value.trim();
    if (!name || url.indexOf('{z}') < 0) { $('customUrl').placeholder = 'URL must contain {z}, {x} and {y}'; return; }
    customs.push({ name: name, url: url }); store.set('customs', customs);
    var k = 'c' + (customs.length - 1);
    overlays[k] = { name: name, custom: true, layer: L.tileLayer(url, { maxZoom: 20 }) };
    state.on.push(k); store.set('state', state); applyOverlay(k);
    $('customName').value = ''; $('customUrl').value = ''; renderLayers();
  });

  // Sheets
  var sheets = ['layersSheet', 'pinSheet', 'listSheet'];
  function show(id) { sheets.forEach(function (s) { $(s).hidden = s !== id; }); }
  function closeAll() { show(null); if (draft) { map.removeLayer(draft); draft = null; } }
  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeAll); });
  $('btnLayers').addEventListener('click', function () { show($('layersSheet').hidden ? 'layersSheet' : null); });
  $('btnPins').addEventListener('click', function () { renderPins(); show($('listSheet').hidden ? 'listSheet' : null); });

  // Pins
  var pins = store.get('pins', []);
  var draft = null, draftLL = null;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : ''; }
  function popupHtml(p) {
    return '<b>' + esc(p.title || 'Pin') + '</b><br>' + esc(p.note || '') +
      (safeUrl(p.link) ? '<br><a href="' + esc(safeUrl(p.link)) + '" target="_blank" rel="noopener">Open link</a>' : '') +
      '<br><a href="https://maps.apple.com/?ll=' + p.lat + ',' + p.lng + '&q=' + encodeURIComponent(p.title || 'Pin') + '">Open in Apple Maps</a>';
  }
  function drawPins() {
    pinsLayer.clearLayers();
    pins.forEach(function (p) { L.marker([p.lat, p.lng]).bindPopup(popupHtml(p)).addTo(pinsLayer); });
  }
  function renderPins() {
    var el = $('pinList'); el.innerHTML = '';
    if (!pins.length) { el.innerHTML = '<p class="muted">No pins yet. Press and hold on the map to drop one.</p>'; return; }
    pins.forEach(function (p, i) {
      var d = document.createElement('div'); d.className = 'pin-item';
      d.innerHTML = '<b>' + esc(p.title || 'Pin') + '</b><span class="muted">' + esc(p.note || '') + '</span>' +
        '<div class="btns"><button class="btn">Go</button><button class="btn danger">Delete</button></div>';
      var bs = d.querySelectorAll('button');
      bs[0].addEventListener('click', function () { map.setView([p.lat, p.lng], Math.max(map.getZoom(), 16)); closeAll(); });
      bs[1].addEventListener('click', function () { pins.splice(i, 1); store.set('pins', pins); drawPins(); renderPins(); });
      el.appendChild(d);
    });
  }
  map.on('contextmenu', function (e) {
    draftLL = e.latlng;
    if (draft) map.removeLayer(draft);
    draft = L.marker(e.latlng).addTo(map);
    $('pinCoords').textContent = e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
    $('pinTitle').value = ''; $('pinNote').value = ''; $('pinLink').value = '';
    show('pinSheet');
  });
  $('pinSave').addEventListener('click', function () {
    if (!draftLL) return;
    pins.push({ lat: draftLL.lat, lng: draftLL.lng, title: $('pinTitle').value.trim(), note: $('pinNote').value.trim(), link: $('pinLink').value.trim() });
    store.set('pins', pins); drawPins(); closeAll();
  });
  drawPins();

  // Locate
  var me = null;
  $('btnLocate').addEventListener('click', function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      var ll = [pos.coords.latitude, pos.coords.longitude];
      if (me) map.removeLayer(me);
      me = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#2f80ff', fillOpacity: 1 }).addTo(map);
      map.setView(ll, 16);
    }, function () { $('btnLocate').textContent = 'No GPS'; setTimeout(function () { $('btnLocate').textContent = 'Me'; }, 2000); }, { enableHighAccuracy: true, timeout: 10000 });
  });

  // Search (OpenStreetMap Nominatim)
  $('q').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var q = e.target.value.trim(); if (!q) return;
    e.target.blur();
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.length) { e.target.value = ''; e.target.placeholder = 'Nothing found'; return; }
        var r = res[0];
        if (r.boundingbox) map.fitBounds([[+r.boundingbox[0], +r.boundingbox[2]], [+r.boundingbox[1], +r.boundingbox[3]]], { maxZoom: 18 });
        else map.setView([+r.lat, +r.lon], 16);
      })
      .catch(function () { e.target.placeholder = 'Search failed. Check connection.'; });
  });
})();
</script>
</body>
</html>
